server:
  port: 8080

spring:
  application:
    name: stock-signal
  # M1a 接入真实 MySQL 后移除下面这行排除（届时需要可用的数据源才能启动）
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/stock_signal?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:stock}
    password: ${DB_PASSWORD:stock}

mybatis:
  configuration:
    map-underscore-to-camel-case: true

# API 文档（springdoc）：文档从代码注解生成，接口改动必须同步维护注解
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
