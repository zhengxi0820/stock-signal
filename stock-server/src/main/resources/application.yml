server:
  port: 8080

spring:
  application:
    name: stock-signal
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/stock_signal?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:stock}
    password: ${DB_PASSWORD:stock}

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# 通知实现：console（默认）/ wechat（需环境变量 PUSHPLUS_TOKEN）
stock:
  notifier: ${NOTIFIER:console}
  fetch:
    # fetch 脚本路径：Windows 用 .venv/Scripts/python.exe，Linux 服务器用 .venv/bin/python
    python-path: ${FETCH_PYTHON:fetch/.venv/Scripts/python.exe}
    script-dir: ${FETCH_DIR:fetch}

# API 文档（springdoc）：文档从代码注解生成，接口改动必须同步维护注解
# 认证启用后 swagger 也需登录；生产可用 SWAGGER_ENABLED=false 整体关闭
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}
